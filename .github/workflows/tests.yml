# Lance les tests automatiques sur chaque Pull Request.
# Volontairement léger : pas de Spark, Kafka ni MongoDB, seulement les tests pytest.
name: tests

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer le minimum
        run: pip install pandas numpy python-dotenv pytest
      - name: Lancer les tests
        run: pytest -q
