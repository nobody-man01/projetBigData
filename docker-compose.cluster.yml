# Mode CLUSTER : Kafka à 3 brokers (données répliquées) + cluster Spark standalone (1 master, 2 workers).
# Le mode simple (docker-compose.yml) reste disponible ; les deux utilisent les mêmes ports : un seul à la fois.
#
#   docker compose -f docker-compose.cluster.yml up -d --build
#   docker compose -f docker-compose.cluster.yml down
#
# Interfaces : Spark master http://localhost:8080 · mongo-express http://localhost:8081
# Depuis la machine hôte, Kafka répond sur localhost:9092, 9094 et 9096 (un port par broker).
name: momo-cluster

x-kafka: &kafka
  image: apache/kafka:3.8.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null"]
    interval: 10s
    timeout: 10s
    retries: 12

x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  # Tolérance aux pannes : 3 copies de chaque message, une écriture est validée dès que 2 copies existent
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m

x-spark: &spark
  image: momo-spark:4.2.0
  pull_policy: never     # image construite localement par le service spark-master
  volumes:
    - ./:/app            # même chemin /app partout : les workers lisent les données et écrivent le modèle

services:
  kafka-1:
    <<: *kafka
    container_name: momo-kafka-1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092

  kafka-2:
    <<: *kafka
    container_name: momo-kafka-2
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:9094

  kafka-3:
    <<: *kafka
    container_name: momo-kafka-3
    ports: ["9096:9096"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9096,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:9096

  # Crée le topic une fois les 3 brokers prêts : 3 partitions, 3 réplicas, 2 réplicas synchrones minimum
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: momo-kafka-init
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --create --if-not-exists
        --topic momo.transactions.raw --partitions 3 --replication-factor 3 --config min.insync.replicas=2
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:19092 --describe --topic momo.transactions.raw

  spark-master:
    <<: *spark
    build:
      context: docker/spark
      args: { HOST_UID: "${HOST_UID:-1000}", HOST_GID: "${HOST_GID:-1000}" }
    pull_policy: build
    container_name: momo-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    environment:
      SPARK_DAEMON_MEMORY: 384m
    ports: ["8080:8080", "7077:7077"]

  spark-worker-1: &worker
    <<: *spark
    container_name: momo-spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1536m
      SPARK_DAEMON_MEMORY: 256m
    depends_on: [spark-master]

  spark-worker-2:
    <<: *worker
    container_name: momo-spark-worker-2

  # Driver : lance l'entraînement ou le scoring sur le cluster (voir scripts/cluster.sh)
  spark-app:
    <<: *spark
    container_name: momo-spark-app
    hostname: spark-app
    command: ["sleep", "infinity"]
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_MEMORY: 1536m
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      MONGO_URI: mongodb://mongo:27017
    ports: ["4040:4040"]
    volumes:
      - ./:/app
      - ivy_cache:/home/spark/.ivy2   # connecteur Kafka de Spark téléchargé une seule fois
    depends_on: [spark-master, kafka-init, mongo]

  mongo:
    image: mongo:7
    # Par défaut, MongoDB réserve jusqu'à la moitié de la RAM pour son cache : on le limite à 512 Mo
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    container_name: momo-mongo
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1.0.2
    container_name: momo-mongo-express
    ports: ["8081:8081"]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
    depends_on: [mongo]

volumes:
  mongo_data:
  ivy_cache:
